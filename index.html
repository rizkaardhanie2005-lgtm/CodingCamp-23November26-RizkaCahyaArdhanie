<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <div id="balance-display">0.00</div>
  </header>

  <div id="storage-warning" hidden>
    ⚠️ Local Storage is unavailable or contained invalid data. Your transactions will not be saved this session.
  </div>

  <main>
    <section id="form-section">
      <h2>Add Expense</h2>
      <form id="expense-form" novalidate>

        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" name="item-name" placeholder="e.g. Lunch" autocomplete="off" />
          <span class="error-msg" id="error-name"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" placeholder="e.g. 12.50" step="0.01" min="0" />
          <span class="error-msg" id="error-amount"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">-- Select Category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error-msg" id="error-category"></span>
        </div>

        <button type="submit">Add Transaction</button>

      </form>
    </section>

    <section id="history-section">
      <h2>Transaction History</h2>
      <ul id="transaction-list">
        <!-- Transaction items are injected here by js/app.js -->
      </ul>
    </section>

    <section id="chart-section">
      <h2>Spending by Category</h2>
      <div id="chart-container">
        <!-- Chart.js canvas or fallback text injected here by js/app.js -->
      </div>
    </section>
  </main>

  <!-- Chart.js from CDN (loaded before app.js so window.Chart is available) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Application logic -->
  <script src="js/app.js"></script>

</body>
</html>
